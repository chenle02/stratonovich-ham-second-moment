  inputs_tex:
  - ascii: "GroundFamily data fields P, e, ell, lam (C16, E:compact-F-block, E:compact-F-projection, P:compact-ground-family): flows P_sigma(t), vectors e_sigma, bounded linear duals ell_sigma, rates lambda_sigma, for sigma in I = [0,1], t >= 0 (Pi_sigma = e_sigma ell_sigma and Q_sigma = I - Pi_sigma are derived definitions GroundFamily.Pi, GroundFamily.Q, not fields)"
    tex: "\\texttt{GroundFamily} data fields \\texttt{P}, \\texttt{e}, \\texttt{ell}, \\texttt{lam} (E:compact-F-block, E:compact-F-projection, P:compact-ground-family): flows $P_\\sigma(t)$, vectors $e_\\sigma$, bounded linear duals $\\ell_\\sigma$, rates $\\lambda_\\sigma$, for $\\sigma\\in I=[0,1]$, $t\\ge0$ ($\\Pi_\\sigma=e_\\sigma\\ell_\\sigma$ and $Q_\\sigma=I-\\Pi_\\sigma$ are derived definitions \\texttt{GroundFamily.Pi}, \\texttt{GroundFamily.Q}, not fields)"
  - ascii: "GroundFamily data fields e0, obs (S:actual-raw-block-lower): the data e_0 in F and the bounded linear observable O_phi : F -> R"
    tex: "\\texttt{GroundFamily} data fields \\texttt{e0}, \\texttt{obs} (S:actual-raw-block-lower): the data $e_0\\in F$ and the bounded linear observable $O_\\phi:F\\to\\R$"
  - ascii: "GroundFamily fields d0, lam_pos, d0_pos (C16 output, P:compact-ground-family, E:compact-rate-gap): a gap d_0 > 0 and lambda_sigma > 0 on I (weakening of sqrt(eps) <= lambda_sigma)"
    tex: "\\texttt{GroundFamily} fields \\texttt{d0}, \\texttt{lam\\_pos}, \\texttt{d0\\_pos} (P:compact-ground-family, E:compact-rate-gap): a gap $d_0>0$ and $\\lambda_\\sigma>0$ on $I$ (weakening of $\\sqrt\\varepsilon\\le\\lambda_\\sigma$)"
  - ascii: "GroundFamily fields ell_e, P_Pi, Pi_P (C16 output, P:compact-F-projection, E:compact-F-eigen): ell_sigma(e_sigma) = 1 and P_sigma(t) Pi_sigma = Pi_sigma P_sigma(t) = e^(lambda_sigma t) Pi_sigma on I for t >= 0"
    tex: "\\texttt{GroundFamily} fields \\texttt{ell\\_e}, \\texttt{P\\_Pi}, \\texttt{Pi\\_P} (P:compact-F-projection, E:compact-F-eigen): $\\ell_\\sigma(e_\\sigma)=1$ and $P_\\sigma(t)\\Pi_\\sigma=\\Pi_\\sigma P_\\sigma(t)=e^{\\lambda_\\sigma t}\\Pi_\\sigma$ on $I$ for $t\\ge0$"
  - ascii: "GroundFamily field normalized_complement (C16 output, P:compact-F-complement, E:compact-normalized-complement): for every 0 < eta < d_0 a C_eta with ||e^(-lambda_sigma t) P_sigma(t) Q_sigma|| <= C_eta e^(-eta t) uniformly over sigma in I, t >= 0"
    tex: "\\texttt{GroundFamily} field \\texttt{normalized\\_complement} (P:compact-F-complement, E:compact-normalized-complement): for every $0<\\eta<d_0$ a $C_\\eta$ with $\\|e^{-\\lambda_\\sigma t}P_\\sigma(t)Q_\\sigma\\|\\le C_\\eta e^{-\\eta t}$ uniformly over $\\sigma\\in I$, $t\\ge0$"
  - ascii: "GroundFamily fields e_cont, ell_cont (C16 output, P:compact-F-projection): norm continuity of sigma -> e_sigma and sigma -> ell_sigma on I"
    tex: "\\texttt{GroundFamily} fields \\texttt{e\\_cont}, \\texttt{ell\\_cont} (P:compact-F-projection): norm continuity of $\\sigma\\mapsto e_\\sigma$ and $\\sigma\\mapsto\\ell_\\sigma$ on $I$"
