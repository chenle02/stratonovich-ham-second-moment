- label: L:raw-block-indexed-cone
  ascii: "Every conclusion is proved for an abstract ground family (flows, vectors, duals, rates and observable, with the properties of the compact mean family supplied as inputs); its identification with the physical wave family of the compact mean family is not formalized."
