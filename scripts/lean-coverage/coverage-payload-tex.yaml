- label: L:fixed-split
  ascii: "Lean proves E:fixed-split-bound with C_split = 100^8 e^8 max(1, 12 delta^(-2)) for any delta > 0, on a finite Fock model of the cutoff Gaussian space with abstract spatial operators, for coefficients of an evolution that is not constructed; the segment bound, the Dyson cube identity, the invariance of the cross subspaces, entire coefficients and E:interval-column are supplied."
  tex: "Lean proves E:fixed-split-bound with $C_{\\rm split}=100^8e^8\\max\\{1,12\\delta^{-2}\\}$ for any $\\delta>0$, on a finite Fock model of the cutoff Gaussian space with abstract spatial operators, for coefficients of an evolution that is not constructed; the segment bound, the Dyson cube identity, the invariance of the cross subspaces, entire coefficients and E:interval-column are supplied."
  proved_tex: "E:fixed-split-bound with $C_{\\rm split}=100^8e^8\\max\\{1,12\\delta^{-2}\\}$ for any $\\delta>0$, on a finite Fock model of the cutoff Gaussian space with abstract spatial operators, for coefficients of an evolution; the segment bound, the Dyson cube identity, the invariance of the cross subspaces, entire coefficients and E:interval-column are supplied."
  not_formalized_tex: "The evolution is not constructed."
  inputs_tex:
  - ascii: "E:interval-column (main TeX lines 2832-2835) for the modes of each color at every rho > 0, as the named input FockColumn of FockForm"
    tex: "E:interval-column for the modes of each color at every $\\rho>0$, as the named input \\texttt{FockColumn} of \\texttt{FockForm}"
  - ascii: "the segment bound of L:interval-complex for the background propagators, ||P_z(t,s)|| <= 100 e^(2 Lambda (t-s)) on every interval free of background endpoints, as applied in E:split-segment-product (lines 3155-3165; SegmentBound); its operator theory is not formalized"
    tex: "the segment bound of L:interval-complex for the background propagators, $\\|P_z(t,s)\\|\\le100e^{2\\Lambda(t-s)}$ on every interval free of background endpoints, as applied in E:split-segment-product (\\texttt{SegmentBound}); its operator theory is not formalized"
  - ascii: "E:interval-cross-cube (lines 3290-3313) on the torus of the background radii, with the integrability of the word on each simplex (DysonCrossCube); variation of constants is not formalized"
    tex: "E:interval-cross-cube on the torus of the background radii, with the integrability of the word on each simplex (\\texttt{DysonCrossCube}); variation of constants is not formalized"
  - ascii: "the invariance of every cross subspace Z_S under the background propagator (lines 3212-3216; BackgroundPreserves) and the absolute convergence of the ordinary coefficients on every polydisc (lines 3097-3101; EntireCoefficients); the cutoff evolution, its propagators and the coefficients U_r v are not constructed"
    tex: "the invariance of every cross subspace $\\mathscr{Z}_S$ under the background propagator (in the proof of L:fixed-split; \\texttt{BackgroundPreserves}) and the absolute convergence of the ordinary coefficients on every polydisc (in the proof of L:fixed-split; \\texttt{EntireCoefficients}); the cutoff evolution, its propagators and the coefficients $U_{\\boldsymbol r}v$ are not constructed"
- label: L:fock-form
  ascii: "Lean proves, with the lemma's hypotheses and nothing supplied, E:fock-sandwich, in coefficient form and as an operator-norm bound with A_0 >= 0 and B bounded self-adjoint on the cutoff Hilbert space, uniformly in eps, m and the band, for finitely many real modes, Hermite degree at most N in the m multiplied coordinates, on a Fourier-side model not identified with the physical-space operators."
  tex: "Lean proves, with the lemma's hypotheses and nothing supplied, E:fock-sandwich, in coefficient form and as an operator-norm bound with $A_0\\ge0$ and $B$ bounded self-adjoint on the cutoff Hilbert space, uniformly in $\\epsilon$, $m$ and the band, for finitely many real modes, Hermite degree at most $N$ in the $m$ multiplied coordinates, on a Fourier-side model not identified with the physical-space operators."
  proved_tex: "With the lemma's hypotheses and nothing supplied, E:fock-sandwich, in coefficient form and as an operator-norm bound with $A_0\\ge0$ and $B$ bounded self-adjoint on the cutoff Hilbert space, uniformly in $\\epsilon$, $m$ and the band, for finitely many real modes, Hermite degree at most $N$ in the $m$ multiplied coordinates, on a Fourier-side model."
  not_formalized_tex: "The Fourier-side model is not identified with the physical-space operators."
- label: L:interval-complex
  ascii: "Lean proves, with the lemma's hypotheses, the adjoint sandwich bound and the numerical-range and scalar steps on W(A_0 - V) with nothing supplied; with the inputs below, the bound 100 e^(2 Lambda h) for the weighted block map, not identified with the propagator in X_Lambda; and E:interval-metric for given finite jump data and, for the scalar conversion factors, along any monotone time partition."
  tex: "Lean proves, with the lemma's hypotheses, the adjoint sandwich bound and the numerical-range and scalar steps on $W(A_0-V)$ with nothing supplied; with the inputs below, the bound $100e^{2\\Lambda h}$ for the weighted block map, not identified with the propagator in $X_\\Lambda$; and E:interval-metric for given finite jump data and, for the scalar conversion factors, along any monotone time partition."
  proved_tex: "With the lemma's hypotheses, the adjoint sandwich bound and the numerical-range and scalar steps on $W(A_0-V)$ with nothing supplied; with the inputs below, the bound $100e^{2\\Lambda h}$ for the weighted block map; and E:interval-metric for given finite jump data and, for the scalar conversion factors, along any monotone time partition."
  not_formalized_tex: "The weighted block map is not identified with the propagator in $X_\\Lambda$."
  inputs_tex:
  - ascii: "E:cp-input (Crouzeix-Palencia, main TeX lines 2277-2286) for C_h, F_h, H_h at L = A_0 - V with weight Lambda: operators of norm at most (1+sqrt 2) M whenever the scalar function is bounded by M on W(L)"
    tex: "E:cp-input (Crouzeix--Palencia) for $C_h$, $F_h$, $H_h$ at $L=A_0-V$ with weight $\\Lambda$: operators of norm at most $(1+\\sqrt2)M$ whenever the scalar function is bounded by $M$ on $W(L)$"
  - ascii: "the inverse-root integral representation of lines 2929-2944 for L^* = A_0 - V^*: Q' - 1 = pi^(-1) int_0^inf J(t) dt with J strongly measurable and ||J(t)|| <= (D/(1-delta_a)) t^(-1/2) kappa^(a-3)"
    tex: "the inverse-root integral representation in the proof of L:interval-complex for $L^*=A_0-V^*$: $Q'-1=\\pi^{-1}\\int_0^\\infty J(t)\\ud t$ with $J$ strongly measurable and $\\|J(t)\\|\\le(D/(1-\\delta_a))t^{-1/2}\\kappa^{a-3}$"
- label: L:interval-contractions
  ascii: "Lean proves, with the lemma's hypotheses and nothing supplied, E:interval-column, its band-compressed form, the phase-insertion bound sqrt(R_alpha) rho^((alpha-2)/2), the sandwich bound R_alpha rho^(alpha-4) with self-adjointness and E:interval-fock, for finitely many real modes, on a Fourier-side model not identified with the physical-space operators, without tensoring by another Hilbert factor."
  tex: "Lean proves, with the lemma's hypotheses and nothing supplied, E:interval-column, its band-compressed form, the phase-insertion bound $\\sqrt{R_\\alpha}\\,\\rho^{(\\alpha-2)/2}$, the sandwich bound $R_\\alpha\\rho^{\\alpha-4}$ with self-adjointness and E:interval-fock, for finitely many real modes, on a Fourier-side model not identified with the physical-space operators, without tensoring by another Hilbert factor."
  proved_tex: "With the lemma's hypotheses and nothing supplied, E:interval-column, its band-compressed form, the phase-insertion bound $\\sqrt{R_\\alpha}\\,\\rho^{(\\alpha-2)/2}$, the sandwich bound $R_\\alpha\\rho^{\\alpha-4}$ with self-adjointness and E:interval-fock, for finitely many real modes, on a Fourier-side model, without tensoring by another Hilbert factor."
  not_formalized_tex: "The Fourier-side model is not identified with the physical-space operators."
- label: L:occupation-raw-square
  ascii: "Lean proves, with the section's hypotheses and nothing supplied, Q: H^1 -> H_sp with <Q(f),Q(h)> = B_Gamma(f^2,h^2), continuous on H^1 (M6), and for fields of O modelled by joint representatives rho_g in H_I (M5) both identities of E:occupation-raw-identities and <Psi,rho_g> <= sqrt(v_Psi A(g)); these are not restated on the class O itself."
  tex: "Lean proves, with the section's hypotheses and nothing supplied, $Q:H^1\\to H_{\\mathrm{sp}}$ with $\\langle Q(f),Q(h)\\rangle=B_\\Gamma(f^2,h^2)$, continuous on $H^1$ (M6), and for fields of $\\mathcal{O}$ modelled by joint representatives $\\rho_g\\in H_I$ (M5) both identities of E:occupation-raw-identities and $\\langle\\Psi,\\rho_g\\rangle\\le\\sqrt{v_\\Psi A(g)}$; these are not restated on the class $\\mathcal{O}$ itself."
  proved_tex: "With the section's hypotheses and nothing supplied, $Q:H^1\\to H_{\\mathrm{sp}}$ with $\\langle Q(f),Q(h)\\rangle=B_\\Gamma(f^2,h^2)$, continuous on $H^1$ (M6), and for fields of $\\mathcal{O}$ modelled by joint representatives $\\rho_g\\in H_I$ (M5) both identities of E:occupation-raw-identities and $\\langle\\Psi,\\rho_g\\rangle\\le\\sqrt{v_\\Psi A(g)}$."
