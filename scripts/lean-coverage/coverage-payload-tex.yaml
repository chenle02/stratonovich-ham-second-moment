  tex: "Lean proves both compact-baseline displays on an abstract nonzero Hilbert space with a supplied free group, isometric velocity reversal and weakly vanishing translations, for a Young evolution given only by convergence of its left Young sums; it proves $W_t^{\\mathsf{T}}J_{\\rm symp}W_t=J_{\\rm symp}$ per frequency and the force skewness for the $L^2$ pairing. $J_E$ and the preservation of $\\omega$ on $E$ are not formalized."
  proved_tex: "Both compact-baseline displays on an abstract nonzero Hilbert space with a supplied free group, isometric velocity reversal and weakly vanishing translations, for a Young evolution given only by convergence of its left Young sums; and $W_t^{\\mathsf{T}}J_{\\rm symp}W_t=J_{\\rm symp}$ per frequency and the force skewness for the $L^2$ pairing."
  not_formalized_tex: "$J_E$ and the preservation of $\\omega$ on $E$ are not formalized."
  inputs_tex:
  - ascii: "the free wave group on E = H^(1/2) x H^(-1/2) with its group law, the isometric velocity reversal with S_E(-h) = R S_E(h) R, and the spatial translations, isometric, commuting with S_E(h) and weakly null as |y| -> infinity (integrated_symplectic_phase.tex lines 121-145); E is an abstract nonzero real Hilbert space"
    tex: "the free wave group on $E=H^{1/2}\\times H^{-1/2}$ with its group law, the isometric velocity reversal with $S_E(-h)=\\mathcal{R}S_E(h)\\mathcal{R}$, and the spatial translations, isometric, commuting with $S_E(h)$ and weakly null as $|y|\\to\\infty$ (in the proof of L:symplectic-free); $E$ is an abstract nonzero real Hilbert space"
  - ascii: "P:constant-young-linear on L(E) (integrated_symplectic_phase.tex lines 105-112): the left Young sums of X over partitions of [s,t] converge in operator norm to U_X(t,s) - I; supplied in the weaker form of convergence along some nontrivial filter of finite node lists in [s,t] (no ordering, endpoint or mesh condition)"
    tex: "P:constant-young-linear on $\\mathcal{L}(E)$ (in the proof of L:symplectic-free): the left Young sums of $X$ over partitions of $[s,t]$ converge in operator norm to $U_X(t,s)-I$; supplied in the weaker form of convergence along some nontrivial filter of finite node lists in $[s,t]$ (no ordering, endpoint or mesh condition)"
- label: L:tube-closed-geometry
