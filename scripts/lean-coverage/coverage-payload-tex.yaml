schema: appf-l14-payload/1
rows:
- label: C:d1-first-calibration
  ascii: "Lean proves C_(1,*) = C_(2,*)/2^((4-alpha)/(3-alpha)) and 2C_(1,*) < C_(2,*) with nothing supplied, E:d1-first-calibration for random variables with the supplied mixed-moment expansion of P:mixed and the supplied first-moment series of the chaos expansion (solution not constructed), and the conditional rate clause for an abstract first moment; the P:Jensen comparison is commentary."
  tex: "Lean proves $C_{1,*}=C_{2,*}/2^{(4-\\alpha)/(3-\\alpha)}$ and $2C_{1,*}<C_{2,*}$ with nothing supplied, E:d1-first-calibration for random variables with the supplied mixed-moment expansion of P:mixed and the supplied first-moment series of the chaos expansion (solution not constructed), and the conditional rate clause for an abstract first moment; the P:Jensen comparison is commentary."
  proved_tex: "$C_{1,*}=C_{2,*}/2^{(4-\\alpha)/(3-\\alpha)}$ and $2C_{1,*}<C_{2,*}$ with nothing supplied, E:d1-first-calibration for random variables with the supplied mixed-moment expansion of P:mixed and the supplied first-moment series of the chaos expansion, and the conditional rate clause for an abstract first moment."
  not_formalized_tex: "The solution is not constructed. The P:Jensen comparison is commentary."
  inputs_tex:
  - ascii: "MixedMoment: the statement of P:mixed (main TeX lines 658-673); here it gives E X_n = sum_D J_(n,0,D)(t) (with X_0 = 1), the odd terms zero and the diagram limits; TRUE for the solution under H:homog"
    tex: "\\texttt{MixedMoment}: the statement of P:mixed; here it gives $\\E X_n=\\sum_DJ_{n,0,D}(t)$ (with $X_0=1$), the odd terms zero and the diagram limits; TRUE for the solution under H:homog"
  - ascii: "FirstMomentSeries: X_0 = 1, u integrable and E u = sum_n E X_n (main TeX line 620 and lines 4949-4950, \"the L^2 expansion permits taking expectations of partial sums\"); TRUE for the solution and its chaos terms"
    tex: "\\texttt{FirstMomentSeries}: $X_0=1$, $u$ integrable and $\\E u=\\sum_n\\E X_n$ (the definition of $X_n$ at the start of S:G0 and the proof of C:d1-first-calibration, ``the $L^2$ expansion permits taking expectations of partial sums''); TRUE for the solution and its chaos terms"
- label: C:intrinsic-spatial-bracket
  ascii: "Lean proves, with the section's hypotheses and nothing supplied, E:intrinsic-spatial-bracket and the comparison S_2^pos <= 2^m F_0(E_(1/2)^O) < 2^m F_a(E_(1/2)^O) for the variational value S_2^pos in place of C_2(Gamma,a) (identified by T:intrinsic-second-moment), with E_(1/2)^O over the class O itself; lambda is the square root of the real Rayleigh supremum."
  tex: "Lean proves, with the section's hypotheses and nothing supplied, E:intrinsic-spatial-bracket and the comparison $S_2^{\\mathrm{pos}}\\le2^mF_0(\\mathcal{E}_{1/2}^{\\mathcal{O}})<2^mF_a(\\mathcal{E}_{1/2}^{\\mathcal{O}})$ for the variational value $S_2^{\\mathrm{pos}}$ in place of $C_2(\\Gamma,a)$ (identified by T:intrinsic-second-moment), with $\\mathcal{E}_{1/2}^{\\mathcal{O}}$ over the class $\\mathcal{O}$ itself; $\\lambda$ is the square root of the real Rayleigh supremum."
  proved_tex: "With the section's hypotheses and nothing supplied, E:intrinsic-spatial-bracket and the comparison $S_2^{\\mathrm{pos}}\\le2^mF_0(\\mathcal{E}_{1/2}^{\\mathcal{O}})<2^mF_a(\\mathcal{E}_{1/2}^{\\mathcal{O}})$ for the variational value $S_2^{\\mathrm{pos}}$ in place of $C_2(\\Gamma,a)$ (identified by T:intrinsic-second-moment), with $\\mathcal{E}_{1/2}^{\\mathcal{O}}$ over the class $\\mathcal{O}$ itself; $\\lambda$ is the square root of the real Rayleigh supremum."
  not_formalized_tex: ""
- label: C:static-interaction
  ascii: "Lean proves E:static-block-series in full; E:static-interaction, with the identification of the interaction map with sum sigma^n Y_n and the order bounds derived from the primitive inputs below; and E:independent-static-blocks from the per-block bound on adapted phases; the Gaussian parity, the first-variance bounds and that per-block bound are supplied."
  tex: "Lean proves E:static-block-series in full; E:static-interaction, with the identification of the interaction map with $\\sum_n\\sigma^nY_n$ and the order bounds derived from the primitive inputs below; and E:independent-static-blocks from the per-block bound on adapted phases; the Gaussian parity, the first-variance bounds and that per-block bound are supplied."
  proved_tex: "E:static-block-series in full; E:static-interaction, with the identification of the interaction map with $\\sum_n\\sigma^nY_n$ and the order bounds derived from the primitive inputs below; and E:independent-static-blocks from the per-block bound on adapted phases; the Gaussian parity, the first-variance bounds and that per-block bound are supplied."
  not_formalized_tex: ""
  inputs_tex:
  - ascii: "for the order bounds (E:all-static-phase-orders, n >= 1; circle bound from L:complex-phase): FockSandwich (E:fock-sandwich in operator form), CPInputs (E:cp-input with the inverse-root integral) and PropagatorBlock (the weighted block map as M_z(h)), with positive A_0 and self-adjoint B at every cutoff (supplied, with the named inputs, in StaticInteractionCompleted)"
    tex: "for the order bounds (E:all-static-phase-orders, $n\\ge1$; circle bound from L:complex-phase): \\texttt{FockSandwich} (E:fock-sandwich in operator form), \\texttt{CPInputs} (E:cp-input with the inverse-root integral) and \\texttt{PropagatorBlock} (the weighted block map as $\\mathcal{M}_z(h)$), with positive $A_0$ and self-adjoint $B$ at every cutoff (supplied, with the named inputs, in \\texttt{StaticInteractionCompleted})"
  - ascii: "FockSandwich, A_0 >= 0 and B = B^* are proved in wave L12 on the Fourier-side model (FockSandwichModel.static_interaction_model_paper), with the added restriction of an orthonormal real family psi_m of size m in L^2(mu_eps) for every Gaussian cutoff m (so mu != 0; the case mu = 0, where every positive-order term vanishes, lines 2608-2609, is not covered by that wrapper)"
    tex: "\\texttt{FockSandwich}, $A_0\\ge0$ and $B=B^*$ are proved in wave L12 on the Fourier-side model (\\texttt{FockSandwichModel.static\\_interaction\\_model\\_paper}), with the added restriction of an orthonormal real family $\\psi_m$ of size $m$ in $L^2(\\mu_\\epsilon)$ for every Gaussian cutoff $m$ (so $\\mu\\ne0$; the case $\\mu=0$, where every positive-order term vanishes, is not covered by that wrapper)"
  - ascii: "the remaining inputs of P:static-phase-all-orders for the order bounds: entireness in the coupling, the coefficient identification, the band and the cutoff removals (see that row)"
    tex: "the remaining inputs of P:static-phase-all-orders for the order bounds: entireness in the coupling, the coefficient identification, the band and the cutoff removals (see that row)"
  - ascii: "the free estimate ||S_0(-+h)||_lambda <= sqrt(e), the group law S_0(-h) S_0(h) = 1, Z_0 = S_0(h)(f,g) and the norm comparisons ||Z_n||_lambda <= (lambda h)^(-1) ||Z_n||_(1/h), ||(f,g)||_(1/h) <= ||(f,g)||_lambda (lines 2735-2751); an abstract complete real inner product space stands for L^2(Omega; X_lambda)"
    tex: "the free estimate $\\|\\mathcal{S}_0(\\mp h)\\|_\\lambda\\le\\sqrt e$, the group law $\\mathcal{S}_0(-h)\\mathcal{S}_0(h)=1$, $Z_0=\\mathcal{S}_0(h)(f,g)$ and the norm comparisons $\\|Z_n\\|_\\lambda\\le(\\lambda h)^{-1}\\|Z_n\\|_{1/h}$, $\\|(f,g)\\|_{1/h}\\le\\|(f,g)\\|_\\lambda$ (in the proof of C:static-interaction); an abstract complete real inner product space stands for $L^2(\\Omega;X_\\lambda)$"
  - ascii: "Gaussian symmetry, E<Y_r, Y_s>_lambda = 0 for r + s odd (line 2752)"
    tex: "Gaussian symmetry, $\\E\\langle Y_r,Y_s\\rangle_\\lambda=0$ for $r+s$ odd (in the proof of C:static-interaction)"
  - ascii: "the first-variance bounds of P:static-phase-variance, E||Y_1||^2 <= e E:phase-born and |E<Y_0, Y_2>| <= N sqrt(e) E:phase-mean (lines 2737-2742)"
    tex: "the first-variance bounds of P:static-phase-variance, $\\E\\|Y_1\\|^2\\le e$ times E:phase-born and $|\\E\\langle Y_0,Y_2\\rangle|\\le N\\sqrt e$ times E:phase-mean (in the proof of C:static-interaction)"
  - ascii: "for E:independent-static-blocks, the per-block bound ||I_j y||^2 <= (1 + E(h_j, sigma_j, lambda)) ||y||^2 on phases adapted to the past (E:static-interaction with density and tensoring with the independent past, lines 2788-2792), adaptation being an abstract predicate preserved by each block, and ||S_0(h_j)||^2 <= e^(lambda h_j)"
    tex: "for E:independent-static-blocks, the per-block bound $\\|\\mathcal{I}_jy\\|^2\\le(1+\\mathcal{E}(h_j,\\sigma_j,\\lambda))\\|y\\|^2$ on phases adapted to the past (E:static-interaction with density and tensoring with the independent past, in the proof of C:static-interaction), adaptation being an abstract predicate preserved by each block, and $\\|\\mathcal{S}_0(h_j)\\|^2\\le e^{\\lambda h_j}$"
- label: C:static-moment-constant-continuity
  ascii: "Every conclusion is proved for an abstract moment function with the supplied facts of the logconvexity proposition and the static minorant and law; the moments of the solution are not constructed, so their identification with that function is not formalized."
  tex: "Every conclusion is proved for an abstract moment function with the supplied facts of the logconvexity proposition and the static minorant and law; the moments of the solution are not constructed, so their identification with that function is not formalized."
  proved_tex: "Every conclusion, for an abstract moment function with the supplied facts of the logconvexity proposition and the static minorant and law."
  not_formalized_tex: "The moments of the solution are not constructed, so their identification with that function is not formalized."
  inputs_tex:
  - ascii: "E:static-minorant-rate of P:static-minorant-lower (field minorant) and Lambda-bar_p(0) = C_p from E:static-ratio-input (fields L0_pos, static_law)"
    tex: "E:static-minorant-rate of P:static-minorant-lower (field \\texttt{minorant}) and $\\overline{\\Lambda}_p(0)=C_p$ from E:static-ratio-input (fields \\texttt{L0\\_pos}, \\texttt{static\\_law})"
  - ascii: "the inputs of P:moment-growth-logconvex: E:full-moment-positive-series and E:full-moment-coefficient-holder of L:full-moment-coefficient-holder (fields series, holder), E:full-upper-bound of T:full-upper (field full_upper), Cauchy-Schwarz (field cauchy_schwarz)"
    tex: "the inputs of P:moment-growth-logconvex: E:full-moment-positive-series and E:full-moment-coefficient-holder of L:full-moment-coefficient-holder (fields \\texttt{series}, \\texttt{holder}), E:full-upper-bound of T:full-upper (field \\texttt{full\\_upper}), Cauchy--Schwarz (field \\texttt{cauchy\\_schwarz})"
- label: C:three-finite-images
  ascii: "Lean proves, with the corollary's hypotheses, that sum_i w_i (T_i)_# Gamma_i is a nonzero covariance with scaling 3 - alpha whose endpoints satisfy H:three-endpoints, and, from the supplied P:three-transfer, the coefficient, moment and asymptotic bounds for an abstract model of A_k(t), E u^2 and M_st; the asymptotic bound is for every spectral measure of the low endpoint."
  tex: "Lean proves, with the corollary's hypotheses, that $\\sum_iw_i(T_i)_\\#\\Gamma_i$ is a nonzero covariance with scaling $3-\\alpha$ whose endpoints satisfy H:three-endpoints, and, from the supplied P:three-transfer, the coefficient, moment and asymptotic bounds for an abstract model of $A_k(t)$, $\\E u^2$ and $\\mathcal{M}_{\\rm st}$; the asymptotic bound is for every spectral measure of the low endpoint."
  proved_tex: "With the corollary's hypotheses, that $\\sum_iw_i(T_i)_\\#\\Gamma_i$ is a nonzero covariance with scaling $3-\\alpha$ whose endpoints satisfy H:three-endpoints, and, from the supplied P:three-transfer, the coefficient, moment and asymptotic bounds for an abstract model of $A_k(t)$, $\\E u^2$ and $\\mathcal{M}_{\\rm st}$; the asymptotic bound is for every spectral measure of the low endpoint."
  not_formalized_tex: ""
  inputs_tex:
  - ascii: "ThreeTransfer: the exact statement of P:three-transfer (main TeX lines 6421-6441, proved there in lines 6443-6792) for an abstract ThreeMomentModel at the midpoint theta; true for the manuscript's A_k(t), E u^2(t,x) and M_st, which the package does not construct"
    tex: "\\texttt{ThreeTransfer}: the exact statement of P:three-transfer (proved in the manuscript) for an abstract \\texttt{ThreeMomentModel} at the midpoint $\\vartheta$; true for the manuscript's $A_k(t)$, $\\E u^2(t,x)$ and $\\mathcal{M}_{\\rm st}$, which the package does not construct"
- label: C:three-product-riesz
  ascii: "Lean proves, with the corollary's hypotheses, that the product and Riesz targets are nonzero covariances with scaling 3 - alpha whose endpoints satisfy H:three-endpoints, and, from the supplied P:three-transfer, the coefficient, moment and asymptotic bounds for an abstract model of A_k(t), E u^2 and M_st; the asymptotic bound is for every spectral measure of the low endpoint."
  tex: "Lean proves, with the corollary's hypotheses, that the product and Riesz targets are nonzero covariances with scaling $3-\\alpha$ whose endpoints satisfy H:three-endpoints, and, from the supplied P:three-transfer, the coefficient, moment and asymptotic bounds for an abstract model of $A_k(t)$, $\\E u^2$ and $\\mathcal{M}_{\\rm st}$; the asymptotic bound is for every spectral measure of the low endpoint."
  proved_tex: "With the corollary's hypotheses, that the product and Riesz targets are nonzero covariances with scaling $3-\\alpha$ whose endpoints satisfy H:three-endpoints, and, from the supplied P:three-transfer, the coefficient, moment and asymptotic bounds for an abstract model of $A_k(t)$, $\\E u^2$ and $\\mathcal{M}_{\\rm st}$; the asymptotic bound is for every spectral measure of the low endpoint."
  not_formalized_tex: ""
  inputs_tex:
  - ascii: "ThreeTransfer: the exact statement of P:three-transfer (main TeX lines 6421-6441, proved there in lines 6443-6792) for an abstract ThreeMomentModel at the midpoint theta; true for the manuscript's A_k(t), E u^2(t,x) and M_st, which the package does not construct"
    tex: "\\texttt{ThreeTransfer}: the exact statement of P:three-transfer (proved in the manuscript) for an abstract \\texttt{ThreeMomentModel} at the midpoint $\\vartheta$; true for the manuscript's $A_k(t)$, $\\E u^2(t,x)$ and $\\mathcal{M}_{\\rm st}$, which the package does not construct"
- label: L:complex-phase
  ascii: "Lean proves, with the lemma's hypotheses, the numerical-range and scalar steps on W(L) with nothing supplied, and, with the inputs below, the bounds 3, 6(1+lambda h), 6 (times e^(lambda h)) for C_h(L), F_h(L), H_h(L), the root comparisons 7/6, 6/5 and the bound 100 e^(2 lambda h) for the weighted block map; its identification with M_z(h) is not formalized."
  tex: "Lean proves, with the lemma's hypotheses, the numerical-range and scalar steps on $W(L)$ with nothing supplied, and, with the inputs below, the bounds $3$, $6(1+\\lambda h)$, $6$ (times $e^{\\lambda h}$) for $C_h(L)$, $F_h(L)$, $H_h(L)$, the root comparisons $7/6$, $6/5$ and the bound $100e^{2\\lambda h}$ for the weighted block map; its identification with $\\mathcal{M}_z(h)$ is not formalized."
  proved_tex: "With the lemma's hypotheses, the numerical-range and scalar steps on $W(L)$ with nothing supplied, and, with the inputs below, the bounds $3$, $6(1+\\lambda h)$, $6$ (times $e^{\\lambda h}$) for $C_h(L)$, $F_h(L)$, $H_h(L)$, the root comparisons $7/6$, $6/5$ and the bound $100e^{2\\lambda h}$ for the weighted block map."
  not_formalized_tex: "The identification of the weighted block map with $\\mathcal{M}_z(h)$ is not formalized."
  inputs_tex:
  - ascii: "E:cp-input (Crouzeix-Palencia, main TeX lines 2277-2286, imported in the TeX) for C_h, F_h, H_h at L = A_0 - zB with its holomorphy precondition: operators of norm at most (1+sqrt 2) M whenever the scalar function is bounded by M on W(L)"
    tex: "E:cp-input (Crouzeix--Palencia, imported in the manuscript) for $C_h$, $F_h$, $H_h$ at $L=A_0-zB$ with its holomorphy precondition: operators of norm at most $(1+\\sqrt2)M$ whenever the scalar function is bounded by $M$ on $W(L)$"
  - ascii: "the inverse-root integral representation of lines 2329-2354 for L^* = A_0 - conj(z)B (bounded holomorphic calculus): Q' - 1 = pi^(-1) int_0^inf J(t) dt with J strongly measurable and ||J(t)|| <= (|z| d/(1-delta_a)) t^(-1/2) kappa^(a-3)"
    tex: "the inverse-root integral representation in the proof of L:complex-phase for $L^*=A_0-\\overline{z}B$ (bounded holomorphic calculus): $Q'-1=\\pi^{-1}\\int_0^\\infty J(t)\\ud t$ with $J$ strongly measurable and $\\|J(t)\\|\\le(|z|d/(1-\\delta_a))t^{-1/2}\\kappa^{a-3}$"
