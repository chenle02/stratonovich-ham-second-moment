    title: The finite smooth spatial ratio
    label: P:spatial-smooth-ratio
  class: same-assumptions
  conclusion: weaker
  conclusion_scope: E:spatial-smooth-score is proved in the existential form (every y below the bound is exceeded
    by some I_Psi - v_Psi/2, with the package's real-Rayleigh rate and integral-form cost); its sSup form and the
    TeX's route to R_0 < inf rest on the named input S1Bdd (the boundedness claim of P:variational-positive-scores).
  claims:
