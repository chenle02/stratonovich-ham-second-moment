  - stratonovich-ham-second-moment-lean/spatial-occupation-completed-spatial-smooth-score-completed-paper
  - stratonovich-ham-second-moment-lean/spatial-occupation-completed-spatial-smooth-score-s-sup-completed-paper
  - stratonovich-ham-second-moment-lean/spatial-occupation-completed-r0-finite-of-s1-bdd-completed-paper
  - stratonovich-ham-second-moment-lean/spatial-occupation-completed-static-controls-of-homog
  - stratonovich-ham-second-moment-lean/spatial-smooth-ratio-spatial-smooth-ratio-r0-paper
  - stratonovich-ham-second-moment-lean/spatial-smooth-ratio-spatial-smooth-ratio-paper
  - stratonovich-ham-second-moment-lean/spatial-smooth-ratio-spatial-smooth-score-paper
  - stratonovich-ham-second-moment-lean/spatial-smooth-ratio-spatial-smooth-score-s-sup-paper
  - stratonovich-ham-second-moment-lean/spatial-smooth-ratio-r0-finite-of-s1-bdd-paper
