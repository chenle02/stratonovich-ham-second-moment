- paper:
    number: Proposition P:variational-unmasked-rate
    title: The unmasked Rayleigh rate
    label: P:variational-unmasked-rate
  class: same-assumptions
  conclusion: weaker
  conclusion_scope: 'Lean proves the Rayleigh-form part with the section''s hypotheses and nothing supplied: for
    lambda defined by the real Rayleigh supremum E:variational-real-rayleigh, a uniform positive floor, the Lipschitz
    bounds and I_Psi positive and finite; the operator statements (H_s self-adjoint, form domain H^1, spectral bottom
    E_s, lambda = sqrt(-E_s)) are not formalized.'
  claims:
  - stratonovich-ham-second-moment-lean/variational-rate-variational-unmasked-rate-paper
  - stratonovich-ham-second-moment-lean/variational-rate-unmasked-rate
  - stratonovich-ham-second-moment-lean/variational-rate-abs-s-sup-rayleigh-set-sub-le
  - stratonovich-ham-second-moment-lean/variational-floor-dilation-floor
  - stratonovich-ham-second-moment-lean/variational-floor-rayleigh-set-floor
  - stratonovich-ham-second-moment-lean/variational-mean-is-rayleigh-trial-mean-iff-paper
  note: The positive floor comes from the dilation floor (VariationalFloor.dilation_floor, uses alpha < 2) applied
    to h_s >= Gamma * Psibar, a different route from P:compact-original-common-trial (TeX lines 150-155). The operator
    half needs unbounded self-adjoint operators (foundation D8).
- paper:
    number: Proposition P:wave-two-variances
    title: Both variance directions
    label: P:wave-two-variances
  class: inputs-supplied
  conclusion: weaker
  conclusion_scope: Lean bounds an abstract variance tied to E|l_R|^2 only through the named input E:variance-normalized-covariance;
    l_R, the spaces E_r and J are not constructed. The spectral core (the sums of the nu_R-integrals of E:variance-normalized-covariance,
    both directions, the h^(2 beta) form) is proved in full with no input.
  claims:
  - stratonovich-ham-second-moment-lean/wave-two-variances-wave-two-variances-paper
  - stratonovich-ham-second-moment-lean/wave-two-variances-wave-two-variances-core-paper
  - stratonovich-ham-second-moment-lean/wave-two-variances-wave-two-variances-core-beta-paper
  - stratonovich-ham-second-moment-lean/wave-two-variances-wave-two-variances
  - stratonovich-ham-second-moment-lean/wave-two-variances-wave-two-variances-beta
  - stratonovich-ham-second-moment-lean/wave-two-variances-input-fixed
  - stratonovich-ham-second-moment-lean/wave-two-variances-output-fixed
  - stratonovich-ham-second-moment-lean/wave-two-variances-norm-ker-h-sq-le
  - stratonovich-ham-second-moment-lean/wave-two-variances-continuous-ker-h
  - stratonovich-ham-second-moment-lean/wave-two-variances-sum-norm-sq-le
  - stratonovich-ham-second-moment-lean/wave-two-variances-nu-growth
  inputs:
  - E:variance-normalized-covariance (last claim of P:actual-wave-form, needs the noise construction D1), supplied
    as hlink, ofReal(var R t0 h z w) <= the nu_R lower integral of ||coef(Jz, Jw)||^2, the TeX display with U =
    Jz, V = Jw
  - J maps the phases into L^2(R^d; C^2) preserving inner products (hJL2, hJ; D8, lines 171-176), weaker than the
    TeX's unitary J
  - the identity ||z||_{E_{s-gamma}}^2 = ||<xi>^(-gamma) J z||_2^2 (hnormSG; line 431, D8)
  note: Under H:homog (a = alpha0, no Gamma != 0), 0 < gamma < min(1/2,(2-alpha)/2), T > 0 and the mask zeta, Lean
    proves both directions with C_T = 4 A_T K C_nu uniform in R, I and the family, and the h^(2 beta) form; kernel
    measurability is proved by continuity, not supplied.
