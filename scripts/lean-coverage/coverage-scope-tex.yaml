  tex: "Lean checks the assembly of E:interval-coefficient-bound (length substitution, split count, product-coefficient identity, with L:inventory-product proved in Lean) from E:interval-energy-splits and L:fixed-split as supplied inputs, for $R_\\alpha>0$ and $\\sigma_i>0$, and the summation from it to E:interval-phase-bound."
- label: P:masked-auxiliary-norm
  ascii: "Lean proves, under H:homog and Gamma != 0, that nu_R is even, tempered and Radon, the ball bound E:masked-auxiliary-growth uniformly in R > 0, and E:masked-hilbert-fourier for a separable complex Hilbert space H (indeed any complex Banach space) with integrability and a finite right side; the clause for a real H after complexification is not formalized."
  tex: "Lean proves, under H:homog and $\\Gamma\\neq0$, that $\\nu_R$ is even, tempered and Radon, the ball bound E:masked-auxiliary-growth uniformly in $R>0$, and E:masked-hilbert-fourier for a separable complex Hilbert space $H$ (indeed any complex Banach space) with integrability and a finite right side; the clause for a real $H$ after complexification is not formalized."
- label: P:masked-noise-completion
  ascii: "Lean proves only the finite Gaussian comparison: for A and B - A positive semidefinite, every seminorm N and p >= 1, int N^p dN(0,A) <= int N^p dN(0,B) with both moments finite; the identification of A and B with the masked covariance and auxiliary Gram matrices, E:masked-actual-noise-norm, the contraction extension and joint Gaussianity are not formalized."
  tex: "Lean proves only the finite Gaussian comparison: for $A$ and $B-A$ positive semidefinite, every seminorm $N$ and $p\\ge1$, $\\int N^p\\ud\\mathcal{N}(0,A)\\le\\int N^p\\ud\\mathcal{N}(0,B)$ with both moments finite; the identification of $A$ and $B$ with the masked covariance and auxiliary Gram matrices, E:masked-actual-noise-norm, the contraction extension and joint Gaussianity are not formalized."
- label: P:occupation-physical-class
  ascii: "Lean proves measurability, independence of the representatives, E:occupation-physical-bound (with R_sp) and E:occupation-own-energy (with E_sp) over the class O modelled by fields with jointly measurable representatives of g and of its gradient; the construction of such representatives from strongly H^1-measurable fields (a simple-function approximation) and the converse are not formalized."
  tex: "Lean proves measurability, independence of the representatives, E:occupation-physical-bound (with $R_{\\mathrm{sp}}$) and E:occupation-own-energy (with $\\mathcal{E}_{\\mathrm{sp}}$) over the class $\\mathcal{O}$ modelled by fields with jointly measurable representatives of $g$ and of its gradient; the construction of such representatives from strongly $H^1$-measurable fields (a simple-function approximation) and the converse are not formalized."
