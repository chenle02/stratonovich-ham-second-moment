- label: T:intrinsic-occupation-ceiling
  ascii: "Lean proves c I_Psi - v_Psi/2 <= U_c for every nonnegative smooth control and S_c^pos <= U_c, for every c > 0, with the constant K_0 R_sp, an upper bound of C_occ, in place of C_occ (a larger ceiling); lambda is the square root of the real Rayleigh supremum and v_Psi the integral-form cost. The class O, A(g), C_occ, the second form through E_zeta^O and C_2(Gamma,a) <= U_2 are not formalized."
  tex: "Lean proves $\\mathfrak{c}I_\\Psi-v_\\Psi/2\\le U_{\\mathfrak{c}}$ for every nonnegative smooth control and $S_{\\mathfrak{c}}^{\\mathrm{pos}}\\le U_{\\mathfrak{c}}$, for every $\\mathfrak{c}>0$, with the constant $K_0R_{\\mathrm{sp}}$, an upper bound of $C_{\\rm occ}$, in place of $C_{\\rm occ}$ (a larger ceiling); $\\lambda$ is the square root of the real Rayleigh supremum and $v_\\Psi$ the integral-form cost. The class $\\mathcal{O}$, $A(g)$, $C_{\\rm occ}$, the second form through $\\mathcal{E}_\\zeta^{\\mathcal{O}}$ and $C_2(\\Gamma,a)\\le U_2$ are not formalized."
