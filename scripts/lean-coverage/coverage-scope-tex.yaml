- label: L:spatial-static-controls
  ascii: "lambda is the square root of the supremum of the real Rayleigh quotient, and I_Psi, v_Psi are given by their integral formulas (identification with sqrt(-E_s) and E W(Psi)^2 is not formalized); E:spatial-static-score is proved both in the form that every number below the bound is exceeded by some admissible score and in its supremum form, with nothing supplied."
  tex: "$\\lambda$ is the square root of the supremum of the real Rayleigh quotient, and $I_\\Psi$, $v_\\Psi$ are given by their integral formulas (identification with $\\sqrt{-E_s}$ and $\\E W(\\Psi)^2$ is not formalized); E:spatial-static-score is proved both in the form that every number below the bound is exceeded by some admissible score and in its supremum form, with nothing supplied."
- label: L:symplectic-free
  ascii: "Lean proves both compact-baseline displays on an abstract nonzero Hilbert space with a supplied free group, isometric velocity reversal and weakly vanishing translations, for a Young evolution given only by convergence of its left Young sums; it proves W_t^T J_symp W_t = J_symp per frequency and the force skewness for the L^2 pairing. J_E and the preservation of omega on E are not formalized."
  tex: "Lean proves both compact-baseline displays on an abstract nonzero Hilbert space with a supplied free group, isometric velocity reversal and weakly vanishing translations, for a Young evolution given only by convergence of its left Young sums; it proves $W_t^{\\mathsf{T}}J_{\\rm symp}W_t=J_{\\rm symp}$ per frequency and the force skewness for the $L^2$ pairing. $J_E$ and the preservation of $\\omega$ on $E$ are not formalized."
- label: L:terminal-wick
  ascii: "Proved for real r only, with the chain measures replaced by arbitrary finite measures on n-tuples of points of [0,T] x R^d of total mass T^(2n)/(2n)! (g_n^{T,x} not constructed); the comparison is stated per mixed moment E[Y_m Y_n], not for partial sums; the Wick formula adds a hypothesis the lemma lacks: joint measurability of the covariance."
  tex: "Proved for real $r$ only, with the chain measures replaced by arbitrary finite measures on $n$-tuples of points of $[0,T]\\times\\R^d$ of total mass $T^{2n}/(2n)!$ ($\\mathsf{g}_n^{T,x}$ not constructed); the comparison is stated per mixed moment $\\E[Y_mY_n]$, not for partial sums; the Wick formula adds a hypothesis the lemma lacks: joint measurability of the covariance."
- label: L:tube-rayleigh-tail
  ascii: "Lean proves the bound with integrability and the finite head integral; the \"In particular\" application to the coarse-envelope bound of another proposition is not formalized."
  tex: "Lean proves the bound with integrability and the finite head integral; the ``In particular'' application to the coarse-envelope bound of another proposition is not formalized."
- label: L:variational-control-dilation
  ascii: "Lean proves the bijection and the four identities with the section's hypotheses (H:homog, Gamma != 0, a = alpha0) and nothing supplied, for the variance in its integral form and the rate defined as the square root of the real Rayleigh supremum E:variational-real-rayleigh; their identification with E W(Psi)^2 (L:compact-raw-profile) and sqrt(-E_s) (P:variational-unmasked-rate) is not formalized."
  tex: "Lean proves the bijection and the four identities with the section's hypotheses (H:homog, $\\Gamma\\neq0$, $a=\\alpha_0$) and nothing supplied, for the variance in its integral form and the rate defined as the square root of the real Rayleigh supremum E:variational-real-rayleigh; their identification with $\\E W(\\Psi)^2$ (L:compact-raw-profile) and $\\sqrt{-E_s}$ (P:variational-unmasked-rate) is not formalized."
- label: L:variational-global-mean
  ascii: "Lean proves the display E:variational-global-mean on I = [0,1] (0 <= h_s <= M and ||h_s - h_t||_inf <= C_Psi |s-t|, with integrability, continuity in x and a joint Lipschitz bound); the first sentence, that every mixed time and space derivative of h_s is globally bounded, is not formalized."
  tex: "Lean proves the display E:variational-global-mean on $I=[0,1]$ ($0\\le h_s\\le M$ and $\\|h_s-h_t\\|_\\infty\\le C_\\Psi|s-t|$, with integrability, continuity in $x$ and a joint Lipschitz bound); the first sentence, that every mixed time and space derivative of $h_s$ is globally bounded, is not formalized."
