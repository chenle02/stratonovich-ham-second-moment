- label: L:positive-raw-embedding
  ascii: "Lean proves the variance identity in integral form (for Psi in C_pos the integral of |s-t|^(-a) B_Gamma(Psi_s,Psi_t) over I^2 is genuine and equals v_Psi >= 0) and the row bound int_I |s-t|^(-a) dt <= K_0 with the scalar Schur bound; H_t, H_I, the map J_G and the mean identity for the uniform E mean are not formalized."
  tex: "Lean proves the variance identity in integral form (for $\\Psi\\in\\mathcal{C}_{\\mathrm{pos}}$ the integral of $|s-t|^{-a}B_\\Gamma(\\Psi_s,\\Psi_t)$ over $I^2$ is genuine and equals $v_\\Psi\\ge0$) and the row bound $\\int_I|s-t|^{-a}\\ud t\\le K_0$ with the scalar Schur bound; $H_t$, $H_I$, the map $J_G$ and the mean identity for the uniform $E$ mean are not formalized."
