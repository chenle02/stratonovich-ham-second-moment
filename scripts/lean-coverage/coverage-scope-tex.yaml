# LaTeX versions of coverage.yaml conclusion_scope sentences, for typesetting (e.g. the book appendix).
# Same content as the ASCII sentence in coverage.yaml; math in $...$ with the manuscript macros;
# manuscript labels are bare (a generator turns them into references). coverage/1 has no field for this,
# so it lives here. Keyed by manuscript label; ascii repeats the coverage.yaml text so drift is detectable.
schema: coverage-scope-tex/1
rows:
- label: C:static-interaction
  ascii: "Lean proves E:static-block-series in full and checks the Hilbert-space and scalar steps of E:static-interaction and E:independent-static-blocks; the identification of the interaction map with sum sigma^n Y_n, the order bounds, the Gaussian parity, the first-variance bounds and the per-block bound are supplied."
  tex: "Lean proves E:static-block-series in full and checks the Hilbert-space and scalar steps of E:static-interaction and E:independent-static-blocks; the identification of the interaction map with $\\sum_n\\sigma^nY_n$, the order bounds, the Gaussian parity, the first-variance bounds and the per-block bound are supplied."
- label: L:damped-homogeneous-norms
  ascii: "Only the upper bounds of E:damped-multiplier-comparison are proved (any measurable multiplier in [0,1], measurable domains S inside S'); its lower bounds are stated only for the full and tail domains without a multiplier, and the remarks that Gaussian smoothing gives such multipliers and keeps the N_0 mass identity are not formalized."
  tex: "Only the upper bounds of E:damped-multiplier-comparison are proved (any measurable multiplier in $[0,1]$, measurable domains $S\\subset S'$); its lower bounds are stated only for the full and tail domains without a multiplier, and the remarks that Gaussian smoothing gives such multipliers and keeps the $N_0$ mass identity are not formalized."
- label: L:spatial-fourier-bound
  ascii: "The bound is proved with the constant R_Gamma(1) = int mu(dxi)/(1+|xi|^2) in place of R_alpha of E:intro-spectral-mass; the identity R_Gamma(1) = R_alpha, which the lemma takes from the resolvent calculation in the proof of L:damped-homogeneous-norms, is not formalized."
  tex: "The bound is proved with the constant $\\mathcal{R}_\\Gamma(1)=\\int\\mu(\\ud\\xi)/(1+|\\xi|^2)$ in place of $R_\\alpha$ of E:intro-spectral-mass; the identity $\\mathcal{R}_\\Gamma(1)=R_\\alpha$, which the lemma takes from the resolvent calculation in the proof of L:damped-homogeneous-norms, is not formalized."
- label: L:spatial-static-controls
  ascii: "lambda is the square root of the supremum of the real Rayleigh quotient, and I_Psi, v_Psi are given by their integral formulas (identification with sqrt(-E_s) and E W(Psi)^2 is not formalized); E:spatial-static-score is proved in the form that every number below the bound is exceeded by some admissible score; its supremum form assumes the boundedness claim of P:variational-positive-scores."
  tex: "$\\lambda$ is the square root of the supremum of the real Rayleigh quotient, and $I_\\Psi$, $v_\\Psi$ are given by their integral formulas (identification with $\\sqrt{-E_s}$ and $\\E W(\\Psi)^2$ is not formalized); E:spatial-static-score is proved in the form that every number below the bound is exceeded by some admissible score; its supremum form assumes the boundedness claim of P:variational-positive-scores."
- label: L:tube-rayleigh-tail
  ascii: "Lean proves the bound with integrability and the finite head integral; the \"In particular\" application to the coarse-envelope bound of another proposition is not formalized."
  tex: "Lean proves the bound with integrability and the finite head integral; the ``In particular'' application to the coarse-envelope bound of another proposition is not formalized."
- label: L:variational-control-dilation
  ascii: "Lean proves the bijection and the four identities with the section's hypotheses (H:homog, Gamma != 0, a = alpha0) and nothing supplied, for the variance in its integral form and the rate defined as the square root of the real Rayleigh supremum E:variational-real-rayleigh; their identification with E W(Psi)^2 (L:compact-raw-profile) and sqrt(-E_s) (P:variational-unmasked-rate) is not formalized."
  tex: "Lean proves the bijection and the four identities with the section's hypotheses (H:homog, $\\Gamma\\neq0$, $a=\\alpha_0$) and nothing supplied, for the variance in its integral form and the rate defined as the square root of the real Rayleigh supremum E:variational-real-rayleigh; their identification with $\\E W(\\Psi)^2$ (L:compact-raw-profile) and $\\sqrt{-E_s}$ (P:variational-unmasked-rate) is not formalized."
- label: L:variational-global-mean
  ascii: "Lean proves the display E:variational-global-mean on I = [0,1] (0 <= h_s <= M and ||h_s - h_t||_inf <= C_Psi |s-t|, with integrability, continuity in x and a joint Lipschitz bound); the first sentence, that every mixed time and space derivative of h_s is globally bounded, is not formalized."
  tex: "Lean proves the display E:variational-global-mean on $I=[0,1]$ ($0\\le h_s\\le M$ and $\\|h_s-h_t\\|_\\infty\\le C_\\Psi|s-t|$, with integrability, continuity in $x$ and a joint Lipschitz bound); the first sentence, that every mixed time and space derivative of $h_s$ is globally bounded, is not formalized."
- label: P:interval-coefficients
  ascii: "Lean checks the assembly of E:interval-coefficient-bound (length substitution, split count, product-coefficient identity, with L:inventory-product proved in Lean) from E:interval-energy-splits and L:fixed-split as supplied inputs, for R_alpha > 0 and sigma_i > 0, and the summation from it to E:interval-phase-bound."
  tex: "Lean checks the assembly of E:interval-coefficient-bound (length substitution, split count, product-coefficient identity, with L:inventory-product proved in Lean) from E:interval-energy-splits and L:fixed-split as supplied inputs, for $R_\\alpha>0$ and $\\sigma_i>0$, and the summation from it to E:interval-phase-bound."
- label: P:masked-auxiliary-norm
  ascii: "Lean proves, under H:homog and Gamma != 0, that nu_R is even, tempered and Radon, the ball bound E:masked-auxiliary-growth uniformly in R > 0, and E:masked-hilbert-fourier for a separable complex Hilbert space H (indeed any complex Banach space) with integrability and a finite right side; the clause for a real H after complexification is not formalized."
  tex: "Lean proves, under H:homog and $\\Gamma\\neq0$, that $\\nu_R$ is even, tempered and Radon, the ball bound E:masked-auxiliary-growth uniformly in $R>0$, and E:masked-hilbert-fourier for a separable complex Hilbert space $H$ (indeed any complex Banach space) with integrability and a finite right side; the clause for a real $H$ after complexification is not formalized."
- label: P:occupation-physical-class
  ascii: "Lean proves measurability, independence of the representatives, E:occupation-physical-bound (with R_sp) and E:occupation-own-energy (with E_sp) over the class O modelled by fields with jointly measurable representatives of g and of its gradient; the construction of such representatives from strongly H^1-measurable fields (lines 409-414) and the converse are not formalized."
  tex: "Lean proves measurability, independence of the representatives, E:occupation-physical-bound (with $R_{\\mathrm{sp}}$) and E:occupation-own-energy (with $\\mathcal{E}_{\\mathrm{sp}}$) over the class $\\mathcal{O}$ modelled by fields with jointly measurable representatives of $g$ and of its gradient; the construction of such representatives from strongly $H^1$-measurable fields (lines 409-414) and the converse are not formalized."
- label: P:spatial-energy-map
  ascii: "E:spatial-static-energy-score is proved in an existential form (every y below M_a^(-1/k) F_0(E_sp) is exceeded by some I_Psi - v_Psi/2, with lambda the square root of the Rayleigh supremum E:variational-real-rayleigh and v_Psi by its integral formula); the supremum form assumes the boundedness claim of P:variational-positive-scores."
  tex: "E:spatial-static-energy-score is proved in an existential form (every $y$ below $M_a^{-1/k}F_0(\\mathcal{E}_{\\mathrm{sp}})$ is exceeded by some $I_\\Psi-v_\\Psi/2$, with $\\lambda$ the square root of the Rayleigh supremum E:variational-real-rayleigh and $v_\\Psi$ by its integral formula); the supremum form assumes the boundedness claim of P:variational-positive-scores."
- label: P:spatial-four-linear
  ascii: "Joint continuity of C_4 on (H^1)^4 is proved along convergent sequences (H^1 convergence of the four profiles, that is L^2 convergence of each function and of its weak gradient), not for a topology on (H^1)^4; continuity of A_sp and of the square pairings is not restated separately (they are C_4(f,f,f,f) and C_4(f,f,h,h))."
  tex: "Joint continuity of $C_4$ on $(H^1)^4$ is proved along convergent sequences ($H^1$ convergence of the four profiles, that is $L^2$ convergence of each function and of its weak gradient), not for a topology on $(H^1)^4$; continuity of $A_{\\mathrm{sp}}$ and of the square pairings is not restated separately (they are $C_4(f,f,f,f)$ and $C_4(f,f,h,h)$)."
- label: P:spatial-smooth-ratio
  ascii: "E:spatial-smooth-score is proved in the form that every y below the bound is exceeded by some I_Psi - v_Psi/2 (lambda the square root of the supremum of the real Rayleigh quotient, v_Psi given by its integral formula); its form as a supremum rests on a named input, the boundedness claim of P:variational-positive-scores. R_0 < inf is proved without that input, by L:spatial-fourier-bound."
  tex: "E:spatial-smooth-score is proved in the form that every $y$ below the bound is exceeded by some $I_\\Psi-v_\\Psi/2$ ($\\lambda$ the square root of the supremum of the real Rayleigh quotient, $v_\\Psi$ given by its integral formula); its form as a supremum rests on a named input, the boundedness claim of P:variational-positive-scores. $R_0<\\infty$ is proved without that input, by L:spatial-fourier-bound."
- label: P:variational-unmasked-rate
  ascii: "Lean proves, with the section's hypotheses and nothing supplied, the statements about the Rayleigh supremum E:variational-real-rayleigh: for lambda defined as its square root, a uniform positive floor, the Lipschitz bounds and I_Psi positive and finite; the operator statements (H_s self-adjoint, form domain H^1, spectral bottom E_s, lambda = sqrt(-E_s)) are not formalized."
  tex: "Lean proves, with the section's hypotheses and nothing supplied, the statements about the Rayleigh supremum E:variational-real-rayleigh: for $\\lambda$ defined as its square root, a uniform positive floor, the Lipschitz bounds and $I_\\Psi$ positive and finite; the operator statements ($H_s$ self-adjoint, form domain $H^1$, spectral bottom $E_s$, $\\lambda=\\sqrt{-E_s}$) are not formalized."
