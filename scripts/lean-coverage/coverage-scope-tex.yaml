- label: P:spatial-energy-map
  ascii: "E:spatial-static-energy-score is proved, with nothing supplied, both in an existential form (every y below M_a^(-1/k) F_0(E_sp) is exceeded by some I_Psi - v_Psi/2) and in its supremum form, with lambda the square root of the Rayleigh supremum E:variational-real-rayleigh and v_Psi by its integral formula (their identification with sqrt(-E_s) and E W(Psi)^2 is not formalized)."
  tex: "E:spatial-static-energy-score is proved, with nothing supplied, both in an existential form (every $y$ below $M_a^{-1/k}F_0(\\mathcal{E}_{\\mathrm{sp}})$ is exceeded by some $I_\\Psi-v_\\Psi/2$) and in its supremum form, with $\\lambda$ the square root of the Rayleigh supremum E:variational-real-rayleigh and $v_\\Psi$ by its integral formula (their identification with $\\sqrt{-E_s}$ and $\\E W(\\Psi)^2$ is not formalized)."
- label: P:spatial-four-linear
  ascii: "Joint continuity of C_4 on (H^1)^4 is proved along convergent sequences (H^1 convergence of the four profiles, that is L^2 convergence of each function and of its weak gradient), not for a topology on (H^1)^4; continuity of A_sp and of the square pairings is not restated separately (they are C_4(f,f,f,f) and C_4(f,f,h,h))."
  tex: "Joint continuity of $C_4$ on $(H^1)^4$ is proved along convergent sequences ($H^1$ convergence of the four profiles, that is $L^2$ convergence of each function and of its weak gradient), not for a topology on $(H^1)^4$; continuity of $A_{\\mathrm{sp}}$ and of the square pairings is not restated separately (they are $C_4(f,f,f,f)$ and $C_4(f,f,h,h)$)."
- label: P:spatial-smooth-ratio
  ascii: "E:spatial-smooth-score is proved, with nothing supplied, both in the form that every y below the bound is exceeded by some I_Psi - v_Psi/2 and as a bound on the supremum, with lambda the square root of the real Rayleigh supremum and v_Psi given by its integral formula (identification with sqrt(-E_s) and E W(Psi)^2 is not formalized). R_0 < inf is proved by L:spatial-fourier-bound."
  tex: "E:spatial-smooth-score is proved, with nothing supplied, both in the form that every $y$ below the bound is exceeded by some $I_\\Psi-v_\\Psi/2$ and as a bound on the supremum, with $\\lambda$ the square root of the real Rayleigh supremum and $v_\\Psi$ given by its integral formula (identification with $\\sqrt{-E_s}$ and $\\E W(\\Psi)^2$ is not formalized). $R_0<\\infty$ is proved by L:spatial-fourier-bound."
- label: P:static-phase-all-orders
  ascii: "Lean proves the Cauchy coefficient estimate, the arithmetic at lambda = n/h and the series bound of the proof, and from them both displays for abstract Banach-space quantities, with the circle bound, entireness in the coupling, the coefficient identification, the norm comparisons, the cutoff removals and the free bound supplied; the phases themselves are not constructed."
  tex: "Lean proves the Cauchy coefficient estimate, the arithmetic at $\\lambda=n/h$ and the series bound of the proof, and from them both displays for abstract Banach-space quantities, with the circle bound, entireness in the coupling, the coefficient identification, the norm comparisons, the cutoff removals and the free bound supplied; the phases themselves are not constructed."
- label: P:variational-positive-scores
  ascii: "Lean proves the proposition with the section's hypotheses and nothing supplied, including the boundedness of the value sets and the supremum statements (S_c^pos finite, positive, equal to c^((4-alpha)/(3-alpha)) S_1^pos), with lambda the square root of the real Rayleigh supremum and v_Psi the cost in its integral form; Q_2 >= S_2^pos is not formalized."
  tex: "Lean proves the proposition with the section's hypotheses and nothing supplied, including the boundedness of the value sets and the supremum statements ($S_c^{\\mathrm{pos}}$ finite, positive, equal to $c^{(4-\\alpha)/(3-\\alpha)}S_1^{\\mathrm{pos}}$), with $\\lambda$ the square root of the real Rayleigh supremum and $v_\\Psi$ the cost in its integral form; $Q_2\\ge S_2^{\\mathrm{pos}}$ is not formalized."
- label: P:variational-remove-mask
  ascii: "Lean proves the mask family and every rate statement with the section's hypotheses and nothing supplied, for lambda_(R,s) defined as the square root of the real Rayleigh supremum of m_R h_s (compact ground rates not formalized); E:variational-unmasked-point-lower is derived from E:raw-block-original-lower as a supplied input, for a real function in place of the point moment."
  tex: "Lean proves the mask family and every rate statement with the section's hypotheses and nothing supplied, for $\\lambda_{R,s}$ defined as the square root of the real Rayleigh supremum of $m_Rh_s$ (compact ground rates not formalized); E:variational-unmasked-point-lower is derived from E:raw-block-original-lower as a supplied input, for a real function in place of the point moment."
- label: P:variational-unmasked-rate
  ascii: "Lean proves, with the section's hypotheses and nothing supplied, the statements about the Rayleigh supremum E:variational-real-rayleigh: for lambda defined as its square root, a uniform positive floor, the Lipschitz bounds and I_Psi positive and finite; the operator statements (H_s self-adjoint, form domain H^1, spectral bottom E_s, lambda = sqrt(-E_s)) are not formalized."
  tex: "Lean proves, with the section's hypotheses and nothing supplied, the statements about the Rayleigh supremum E:variational-real-rayleigh: for $\\lambda$ defined as its square root, a uniform positive floor, the Lipschitz bounds and $I_\\Psi$ positive and finite; the operator statements ($H_s$ self-adjoint, form domain $H^1$, spectral bottom $E_s$, $\\lambda=\\sqrt{-E_s}$) are not formalized."
- label: P:wave-two-variances
  ascii: "Lean bounds an abstract variance tied to E|l_R|^2 only through the named input E:variance-normalized-covariance; l_R, the spaces E_r and J are not constructed. The spectral core (the sums of the nu_R-integrals of E:variance-normalized-covariance, both directions, the h^(2 beta) form) is proved in full with no input."
  tex: "Lean bounds an abstract variance tied to $\\E|\\ell_R|^2$ only through the named input E:variance-normalized-covariance; $\\ell_R$, the spaces $E_r$ and $J$ are not constructed. The spectral core (the sums of the $\\nu_R$-integrals of E:variance-normalized-covariance, both directions, the $h^{2\\beta}$ form) is proved in full with no input."
