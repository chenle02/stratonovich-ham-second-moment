# LaTeX versions of coverage.yaml conclusion_scope sentences, for typesetting (e.g. the book appendix).
# One row for every coverage.yaml row that has a conclusion_scope, and no other rows; sorted by label.
# Same content as the ASCII sentence in coverage.yaml; math in $...$ with the manuscript macros;
# manuscript labels are bare (a generator turns them into references). coverage/1 has no field for this,
# so it lives here. Keyed by manuscript label; ascii repeats the coverage.yaml text so drift is detectable.
schema: coverage-scope-tex/1
rows:
- label: C:intrinsic-spatial-bracket
  ascii: "Lean proves, with the section's hypotheses (H:homog, Gamma != 0, a = alpha0) and nothing supplied, E:intrinsic-spatial-bracket and the comparison for the variational value S_2^pos in place of C_2(Gamma,a) (identified by T:intrinsic-second-moment), with the energy D_(1/2)(K_0 R_sp)^(2/(2-alpha)) in place of E_(1/2)^O in the comparison; lambda is the square root of the real Rayleigh supremum."
  tex: "Lean proves, with the section's hypotheses (H:homog, $\\Gamma\\neq0$, $a=\\alpha_0$) and nothing supplied, E:intrinsic-spatial-bracket and the comparison for the variational value $S_2^{\\mathrm{pos}}$ in place of $C_2(\\Gamma,a)$ (identified by T:intrinsic-second-moment), with the energy $D_{1/2}(K_0R_{\\mathrm{sp}})^{2/(2-\\alpha)}$ in place of $\\mathcal{E}_{1/2}^{\\mathcal{O}}$ in the comparison; $\\lambda$ is the square root of the real Rayleigh supremum."
- label: C:static-interaction
  ascii: "Lean proves E:static-block-series in full and checks the Hilbert-space and scalar steps of E:static-interaction and E:independent-static-blocks; the identification of the interaction map with sum sigma^n Y_n, the order bounds, the Gaussian parity, the first-variance bounds and the per-block bound are supplied."
  tex: "Lean proves E:static-block-series in full and checks the Hilbert-space and scalar steps of E:static-interaction and E:independent-static-blocks; the identification of the interaction map with $\\sum_n\\sigma^nY_n$, the order bounds, the Gaussian parity, the first-variance bounds and the per-block bound are supplied."
- label: L:damped-homogeneous-norms
  ascii: "Proved with the lemma's hypotheses except part of the closing smoothing remark: spatial smoothing of the covariance appears only as membership of the Gaussian factor in the multiplier class (its spectral identification is not formalized), and Green smoothing is identified with the smoothed norm only in dimension one. The N_0 mass identity under Green smoothing holds in every dimension."
  tex: "Proved with the lemma's hypotheses except part of the closing smoothing remark: spatial smoothing of the covariance appears only as membership of the Gaussian factor in the multiplier class (its spectral identification is not formalized), and Green smoothing is identified with the smoothed norm only in dimension one. The $N_0$ mass identity under Green smoothing holds in every dimension."
