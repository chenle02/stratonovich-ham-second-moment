# LaTeX versions of coverage.yaml conclusion_scope sentences, for typesetting (e.g. the book appendix).
# Same content as the ASCII sentence in coverage.yaml; math in $...$ with the manuscript macros;
# manuscript labels are bare (a generator turns them into references). coverage/1 has no field for this,
# so it lives here. Keyed by manuscript label; ascii repeats the coverage.yaml text so drift is detectable.
schema: coverage-scope-tex/1
rows:
- label: L:spatial-static-controls
  ascii: "lambda is the square root of the supremum of the real Rayleigh quotient, and I_Psi, v_Psi are given by their integral formulas (identification with sqrt(-E_s) and E W(Psi)^2 is not formalized); E:spatial-static-score is proved in the form that every number below the bound is exceeded by some admissible score; its supremum form assumes the boundedness claim of P:variational-positive-scores."
  tex: "$\\lambda$ is the square root of the supremum of the real Rayleigh quotient, and $I_\\Psi$, $v_\\Psi$ are given by their integral formulas (identification with $\\sqrt{-E_s}$ and $\\E W(\\Psi)^2$ is not formalized); E:spatial-static-score is proved in the form that every number below the bound is exceeded by some admissible score; its supremum form assumes the boundedness claim of P:variational-positive-scores."
- label: L:tube-rayleigh-tail
  ascii: "Lean proves the bound with integrability and the finite head integral; the \"In particular\" application to the coarse-envelope bound of another proposition is not formalized."
  tex: "Lean proves the bound with integrability and the finite head integral; the ``In particular'' application to the coarse-envelope bound of another proposition is not formalized."
- label: L:variational-control-dilation
  ascii: "Lean proves the bijection and the four identities with the section's hypotheses (H:homog, Gamma != 0, a = alpha0) and nothing supplied, for the variance in its integral form and the rate defined by the real Rayleigh supremum E:variational-real-rayleigh; their identification with E W(Psi)^2 (L:compact-raw-profile) and sqrt(-E_s) (P:variational-unmasked-rate) is not formalized."
  tex: "Lean proves the bijection and the four identities with the section's hypotheses (H:homog, $\\Gamma\\neq0$, $a=\\alpha_0$) and nothing supplied, for the variance in its integral form and the rate defined by the real Rayleigh supremum E:variational-real-rayleigh; their identification with $\\E W(\\Psi)^2$ (L:compact-raw-profile) and $\\sqrt{-E_s}$ (P:variational-unmasked-rate) is not formalized."
- label: L:variational-global-mean
  ascii: "Lean proves the display E:variational-global-mean on I = [0,1] (0 <= h_s <= M and ||h_s - h_t||_inf <= C_Psi |s-t|, with integrability, continuity in x and a joint Lipschitz bound); the first sentence, that every mixed time and space derivative of h_s is globally bounded, is not formalized."
  tex: "Lean proves the display E:variational-global-mean on $I=[0,1]$ ($0\\le h_s\\le M$ and $\\|h_s-h_t\\|_\\infty\\le C_\\Psi|s-t|$, with integrability, continuity in $x$ and a joint Lipschitz bound); the first sentence, that every mixed time and space derivative of $h_s$ is globally bounded, is not formalized."
- label: P:masked-auxiliary-norm
  ascii: "Lean proves, under H:homog and Gamma != 0, that nu_R is even, tempered and Radon, the ball bound E:masked-auxiliary-growth uniformly in R > 0, and E:masked-hilbert-fourier for a separable complex Hilbert space H (indeed any complex Banach space) with integrability and a finite right side; the clause for a real H after complexification is not formalized."
  tex: "Lean proves, under H:homog and $\\Gamma\\neq0$, that $\\nu_R$ is even, tempered and Radon, the ball bound E:masked-auxiliary-growth uniformly in $R>0$, and E:masked-hilbert-fourier for a separable complex Hilbert space $H$ (indeed any complex Banach space) with integrability and a finite right side; the clause for a real $H$ after complexification is not formalized."
- label: P:spatial-smooth-ratio
  ascii: "E:spatial-smooth-score is proved in the form that every y below the bound is exceeded by some I_Psi - v_Psi/2 (lambda the square root of the supremum of the real Rayleigh quotient, v_Psi given by its integral formula); its form as a supremum rests on a named input, the boundedness claim of P:variational-positive-scores. R_0 < inf is proved without that input, by a direct Fourier bound."
  tex: "E:spatial-smooth-score is proved in the form that every $y$ below the bound is exceeded by some $I_\\Psi-v_\\Psi/2$ ($\\lambda$ the square root of the supremum of the real Rayleigh quotient, $v_\\Psi$ given by its integral formula); its form as a supremum rests on a named input, the boundedness claim of P:variational-positive-scores. $R_0<\\infty$ is proved without that input, by a direct Fourier bound."
- label: P:variational-unmasked-rate
  ascii: "Lean proves the Rayleigh-form part with the section's hypotheses and nothing supplied: for lambda defined by the real Rayleigh supremum E:variational-real-rayleigh, a uniform positive floor, the Lipschitz bounds and I_Psi positive and finite; the operator statements (H_s self-adjoint, form domain H^1, spectral bottom E_s, lambda = sqrt(-E_s)) are not formalized."
  tex: "Lean proves the Rayleigh-form part with the section's hypotheses and nothing supplied: for $\\lambda$ defined by the real Rayleigh supremum E:variational-real-rayleigh, a uniform positive floor, the Lipschitz bounds and $I_\\Psi$ positive and finite; the operator statements ($H_s$ self-adjoint, form domain $H^1$, spectral bottom $E_s$, $\\lambda=\\sqrt{-E_s}$) are not formalized."
