name: Interpretation or question
description: Ask about a result, the method, or the development history, or offer an interpretation.
title: "[question] <topic>"
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Open-ended discussion fits GitHub Discussions best. Use this form for
        a focused question with an answer, or an interpretation tied to
        specific results or commits.
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - The mathematics (a result, a constant, a regime)
        - The method or a proof route
        - The development history (a commit, a review, a failed route)
        - The verification ledger or the Lean companion
        - Something else
    validations:
      required: true
  - type: input
    id: refs
    attributes:
      label: Labels, files or commits concerned
      placeholder: "T:..., notes/..., <commit SHA>"
  - type: textarea
    id: body
    attributes:
      label: Your question or interpretation
    validations:
      required: true
